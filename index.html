<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Уроки</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#0f172a;color:#f1f5f9;font-family:system-ui,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{margin:8px 0 2px;font-size:28px}
.sub{color:#94a3b8;margin-bottom:16px}
.card{background:#1e293b;border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{display:flex;align-items:center;gap:8px;font-weight:600}
input[type=text],input[type=time]{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:16px}
input[type=time]{width:auto}
input[type=checkbox]{width:22px;height:22px;accent-color:#38bdf8}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#38bdf8;color:#0f172a}
button.alt{background:#334155;color:#f1f5f9}
button.del{background:transparent;color:#f87171;padding:6px 10px;font-size:20px}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #334155}
.task:last-child{border-bottom:0}
.task .t{flex:1}
.task .s{font-size:12px;color:#38bdf8;font-weight:700}
.task.done .x{text-decoration:line-through;color:#64748b}
#status{min-height:20px;margin-top:8px;font-size:14px;color:#fbbf24}
.empty{color:#64748b;text-align:center;padding:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📚 Уроки</h1>
  <div class="sub" id="counter"></div>

  <div class="card">
    <label><input type="checkbox" id="remOn"> Напоминать каждый день</label>
    <div class="row" style="margin-top:10px">
      <span>В</span><input type="time" id="remTime" value="16:00">
      <button class="alt" id="testBtn">Проверить</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card">
    <input type="text" id="subject" placeholder="Предмет (математика…)" style="margin-bottom:8px">
    <div class="row">
      <input type="text" id="what" placeholder="Что задали?" style="flex:1">
      <button id="addBtn">＋</button>
    </div>
  </div>

  <div class="card" id="list"></div>
  <button class="alt" id="clearBtn" style="width:100%">Убрать выполненные</button>
</div>

<script>
const $ = id => document.getElementById(id);
const LN = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.LocalNotifications;

function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
let tasks = load("hw_tasks", []);
let settings = load("hw_settings", { on: false, time: "16:00" });
function save() {
  try {
    localStorage.setItem("hw_tasks", JSON.stringify(tasks));
    localStorage.setItem("hw_settings", JSON.stringify(settings));
  } catch (e) {}
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const left = () => tasks.filter(t => !t.done).length;

function say(msg) { $("status").textContent = msg || ""; }

function render() {
  $("counter").textContent = left() ? "Осталось заданий: " + left() : "Всё сделано! 🎉";
  $("list").innerHTML = tasks.length ? tasks.map((t, i) =>
    `<div class="task ${t.done ? "done" : ""}">
       <input type="checkbox" ${t.done ? "checked" : ""} data-c="${i}">
       <div class="t">${t.subject ? `<div class="s">${esc(t.subject)}</div>` : ""}<div class="x">${esc(t.what)}</div></div>
       <button class="del" data-d="${i}">✕</button>
     </div>`).join("") : '<div class="empty">Заданий пока нет</div>';
  $("remOn").checked = settings.on;
  $("remTime").value = settings.time;
}

async function schedule(ask) {
  if (!LN) { if (settings.on) say("Напоминания работают только в установленном приложении."); return; }
  try {
    await LN.cancel({ notifications: [{ id: 1 }] });
    if (!settings.on) { say("Напоминания выключены."); return; }
    if (ask) {
      const p = await LN.requestPermissions();
      if (p.display !== "granted") {
        settings.on = false; save(); render();
        say("Разреши уведомления для приложения в настройках телефона.");
        return;
      }
    }
    const [h, m] = settings.time.split(":").map(Number);
    await LN.schedule({ notifications: [{
      id: 1,
      title: "📚 Пора делать уроки!",
      body: left() ? "Осталось заданий: " + left() : "Проверь, что задали на завтра",
      schedule: { on: { hour: h, minute: m }, allowWhileIdle: true }
    }] });
    say("Напоминание каждый день в " + settings.time + " ✅");
  } catch (e) { say("Не удалось поставить напоминание."); }
}

function change() { save(); render(); if (settings.on) schedule(false); }

$("addBtn").onclick = () => {
  const what = $("what").value.trim();
  if (!what) return;
  tasks.unshift({ subject: $("subject").value.trim(), what, done: false });
  $("what").value = "";
  change();
};
$("what").addEventListener("keydown", e => { if (e.key === "Enter") $("addBtn").click(); });

$("list").onclick = e => {
  const c = e.target.dataset.c, d = e.target.dataset.d;
  if (c !== undefined) { tasks[c].done = e.target.checked; change(); }
  if (d !== undefined) { tasks.splice(d, 1); change(); }
};
$("clearBtn").onclick = () => { tasks = tasks.filter(t => !t.done); change(); };

$("remOn").onchange = e => { settings.on = e.target.checked; save(); schedule(true); };
$("remTime").onchange = e => { settings.time = e.target.value || "16:00"; save(); if (settings.on) schedule(false); };

$("testBtn").onclick = async () => {
  if (!LN) { say("Проверка работает только в установленном приложении."); return; }
  try {
    const p = await LN.requestPermissions();
    if (p.display !== "granted") { say("Разреши уведомления в настройках телефона."); return; }
    await LN.schedule({ notifications: [{
      id: 2, title: "📚 Пора делать уроки!", body: "Это проверка напоминания",
      schedule: { at: new Date(Date.now() + 5000) }
    }] });
    say("Уведомление придёт через 5 секунд.");
  } catch (e) { say("Не удалось отправить проверку."); }
};

render();
if (settings.on) schedule(false);
</script>
</body>
</html>
